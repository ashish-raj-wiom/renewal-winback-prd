<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renewal Win-Back Offer — PRD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<style>
  :root {
    --paper:#F4F4F7; --surface:#FFF; --ink:#191B28; --muted:#63667A; --faint:#8B8EA0;
    --rule:#DCDCE4; --rule-soft:#E9E9EF; --accent:#4A5578; --bonus:#B8781A; --flag:#A33A2E;
    --code-bg:#EEEEF3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#13141B; --surface:#1B1D26; --ink:#E7E7EE; --muted:#9B9EB0; --faint:#767989;
      --rule:#2B2D38; --rule-soft:#23252F; --accent:#8D97BC; --bonus:#E3A845; --flag:#E08070;
      --code-bg:#23252F;
    }
  }
  :root[data-theme="dark"] {
    --paper:#13141B; --surface:#1B1D26; --ink:#E7E7EE; --muted:#9B9EB0; --faint:#767989;
    --rule:#2B2D38; --rule-soft:#23252F; --accent:#8D97BC; --bonus:#E3A845; --flag:#E08070;
    --code-bg:#23252F;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Newsreader",Georgia,serif; font-size:17px; line-height:1.62;
    -webkit-font-smoothing:antialiased;
  }
  .shell{max-width:74rem;margin:0 auto;padding-inline:20px;padding-block:0 80px;display:grid;grid-template-columns:15rem 1fr;gap:48px}
  @media(max-width:920px){.shell{grid-template-columns:1fr;gap:0}}

  /* Masthead */
  .top{grid-column:1/-1;padding-block:40px 24px;border-bottom:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
  .brand{display:flex;flex-direction:column;gap:6px}
  .eyebrow{font-family:"Archivo",sans-serif;font-size:.7rem;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
  .brand h1{margin:0;font-family:"Archivo",sans-serif;font-size:clamp(1.5rem,4vw,2rem);font-weight:700;letter-spacing:-.025em;line-height:1.08}
  .tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn{
    font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--muted);
    border:1px solid var(--rule);background:var(--surface);border-radius:4px;
    padding:7px 11px;cursor:pointer;text-decoration:none;display:inline-block
  }
  .btn:hover{color:var(--ink);border-color:var(--accent)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* TOC */
  nav.toc{position:sticky;top:20px;align-self:start;max-height:calc(100vh - 40px);overflow-y:auto;padding-block:28px;font-family:"Archivo",sans-serif;font-size:.82rem}
  @media(max-width:920px){nav.toc{position:static;max-height:none;border-bottom:1px solid var(--rule);padding-bottom:20px}}
  nav.toc a{display:block;color:var(--muted);text-decoration:none;padding:4px 0 4px 10px;border-left:2px solid transparent;line-height:1.35}
  nav.toc a:hover{color:var(--ink)}
  nav.toc a.h3{padding-left:22px;font-size:.76rem;color:var(--faint)}
  nav.toc a.active{color:var(--ink);border-left-color:var(--bonus);font-weight:600}

  /* Document */
  main{padding-block:28px;min-width:0}
  main h1{font-family:"Archivo",sans-serif;font-size:clamp(1.7rem,5vw,2.4rem);font-weight:700;letter-spacing:-.028em;line-height:1.08;margin:0 0 14px;text-wrap:balance}
  main h2{font-family:"Archivo",sans-serif;font-size:1.35rem;font-weight:600;letter-spacing:-.018em;margin:52px 0 14px;padding-top:18px;border-top:1px solid var(--rule);text-wrap:balance}
  main h3{font-family:"Archivo",sans-serif;font-size:1rem;font-weight:600;margin:32px 0 10px;letter-spacing:-.008em}
  main h4{font-family:"Archivo",sans-serif;font-size:.88rem;font-weight:600;margin:24px 0 8px;color:var(--muted)}
  main p{margin:0 0 16px;max-width:42rem}
  main ul,main ol{max-width:42rem;padding-left:22px}
  main li{margin-bottom:6px}
  main hr{border:0;border-top:1px solid var(--rule-soft);margin:36px 0}
  main a{color:var(--ink);text-decoration-color:var(--bonus);text-underline-offset:3px}
  main strong{font-weight:600}

  blockquote{
    margin:0 0 22px;padding:2px 0 2px 18px;border-left:3px solid var(--bonus);
    color:var(--muted);max-width:42rem;font-size:.97rem
  }
  blockquote p:last-child{margin-bottom:0}

  code{font-family:"IBM Plex Mono",monospace;font-size:.85em;background:var(--code-bg);padding:1px 5px;border-radius:3px}
  pre{background:var(--code-bg);padding:14px 16px;border-radius:6px;overflow-x:auto}
  pre code{background:none;padding:0}

  .tablewrap{overflow-x:auto;margin:0 0 22px;border:1px solid var(--rule-soft);border-radius:6px}
  table{border-collapse:collapse;width:100%;font-size:.86rem;font-family:"Newsreader",serif}
  th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
  th{
    font-family:"Archivo",sans-serif;font-size:.68rem;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;color:var(--faint);background:var(--surface);
    border-bottom:1px solid var(--rule);white-space:nowrap;position:sticky;top:0
  }
  tbody tr:last-child td{border-bottom:none}
  td code{font-size:.82em}

  /* The AI-review marker, made visible */
  .aiflag{
    display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:.65rem;font-weight:600;
    letter-spacing:.05em;color:var(--flag);border:1px solid var(--flag);border-radius:3px;
    padding:1px 5px;margin-left:4px;white-space:nowrap;vertical-align:1px
  }

  /* What changed in this update */
  .chg{
    display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:.6rem;font-weight:600;
    letter-spacing:.06em;border-radius:3px;padding:1px 5px;margin-left:6px;white-space:nowrap;
    vertical-align:1px;text-transform:uppercase
  }
  .chg.new{color:#1c6b4a;background:#d8f0e4;border:1px solid #7cc4a4}
  .chg.edited{color:#8a5a12;background:#fbeed2;border:1px solid #d7ab5c}
  :root[data-theme="dark"] .chg.new,
  :root:not([data-theme="light"]) .chg.new{color:#8fe0b8;background:#17342a;border-color:#2f6a51}
  :root[data-theme="dark"] .chg.edited,
  :root:not([data-theme="light"]) .chg.edited{color:#f0c878;background:#3a2c14;border-color:#7a5c22}
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]) .chg.new{color:#1c6b4a;background:#d8f0e4;border-color:#7cc4a4}
    :root:not([data-theme="dark"]) .chg.edited{color:#8a5a12;background:#fbeed2;border-color:#d7ab5c}
  }
  tr.is-chg > td:first-child{box-shadow:inset 3px 0 0 var(--bonus)}
  body.spotlight tr:not(.is-chg){opacity:.28}
  body.spotlight tr.is-chg{opacity:1}
  .btn.on{color:var(--ink);border-color:var(--bonus)}

  .whatsnew{
    border:1px solid var(--rule);border-left:3px solid var(--bonus);border-radius:6px;
    background:var(--surface);padding:16px 18px;margin:0 0 26px
  }
  .whatsnew h3{
    font-family:"Archivo",sans-serif;font-size:.78rem;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;color:var(--faint);margin:0 0 10px
  }
  .whatsnew ul{margin:0;padding-left:18px;max-width:46rem}
  .whatsnew li{margin-bottom:5px;font-size:.92rem}
  .whatsnew .v{
    font-family:"IBM Plex Mono",monospace;font-size:.7rem;color:var(--bonus);font-weight:600
  }

  .mermaid{background:var(--surface);border:1px solid var(--rule-soft);border-radius:6px;padding:18px;margin:0 0 22px;overflow-x:auto;text-align:center}

  .status{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--faint);padding:40px 0}
  .status.err{color:var(--flag)}
  footer{grid-column:1/-1;border-top:1px solid var(--rule);margin-top:40px;padding-top:18px;font-family:"IBM Plex Mono",monospace;font-size:.7rem;color:var(--faint);line-height:1.7}
  @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="shell">

  <header class="top">
    <div class="brand">
      <span class="eyebrow">Wiom · Offer Engine · Renewal use case</span>
      <h1>Renewal Win-Back Offer</h1>
    </div>
    <div class="tools">
      <button class="btn" id="spotBtn" type="button">spotlight changes</button>
      <button class="btn" id="themeBtn" type="button">theme</button>
      <a class="btn" id="srcLink" href="Renewal_Win_Back_Offer_PRD.md">view .md source</a>
      <a class="btn" id="editLink" href="#">edit on github</a>
    </div>
  </header>

  <nav class="toc" id="toc" aria-label="Contents"></nav>

  <main id="doc">
    <p class="status" id="status">Loading the PRD…</p>
  </main>

  <footer>
    This page renders <code>Renewal_Win_Back_Offer_PRD.md</code> from this repository at load time.
    The markdown file is the single source of truth — edit it and this page follows.
  </footer>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<script>
(function () {
  var MD = 'Renewal_Win_Back_Offer_PRD.md';
  var REPO = 'ashish-raj-wiom/renewal-winback-prd';
  document.getElementById('editLink').href =
    'https://github.com/' + REPO + '/edit/master/' + MD;

  // ── Theme toggle ─────────────────────────────────────────────
  var root = document.documentElement;
  try {
    var saved = localStorage.getItem('prd-theme');
    if (saved) root.setAttribute('data-theme', saved);
  } catch (e) {}
  document.getElementById('themeBtn').addEventListener('click', function () {
    var isDark = root.getAttribute('data-theme') === 'dark' ||
      (!root.getAttribute('data-theme') &&
        window.matchMedia('(prefers-color-scheme: dark)').matches);
    var next = isDark ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('prd-theme', next); } catch (e) {}
    drawMermaid();
  });

  function darkNow() {
    var t = root.getAttribute('data-theme');
    if (t) return t === 'dark';
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  // ── Mermaid ──────────────────────────────────────────────────
  var mermaidSources = [];
  function drawMermaid() {
    if (!window.mermaid || !mermaidSources.length) return;
    mermaid.initialize({
      startOnLoad: false,
      theme: darkNow() ? 'dark' : 'neutral',
      securityLevel: 'strict',
      flowchart: { curve: 'basis', useMaxWidth: true }
    });
    document.querySelectorAll('.mermaid').forEach(function (el, i) {
      el.removeAttribute('data-processed');
      el.innerHTML = mermaidSources[i] || '';
    });
    try { mermaid.run({ querySelector: '.mermaid' }); } catch (e) {}
  }

  // ── Render ───────────────────────────────────────────────────
  function fail(title, body) {
    var doc = document.getElementById('doc');
    doc.innerHTML = '<h2 style="border:0;margin-top:0">' + title + '</h2>' +
      '<p>' + body + '</p>' +
      '<p><a href="https://ashish-raj-wiom.github.io/renewal-winback-prd/">' +
      'Open the hosted page</a> &nbsp;·&nbsp; ' +
      '<a href="https://github.com/' + REPO + '/blob/master/' + MD + '">read the markdown on GitHub</a></p>';
  }

  if (location.protocol === 'file:') {
    fail('This page needs a web server',
      'You have opened it straight from disk. Browsers block a page on <code>file://</code> from ' +
      'reading a file next to it, so the PRD cannot be fetched here. It works over http — on ' +
      'GitHub Pages, or locally with any static server pointed at this folder.');
    return;
  }

  var ctl = ('AbortController' in window) ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 15000);

  fetch(MD + '?v=' + Date.now(), { cache: 'no-store', signal: ctl && ctl.signal })
    .then(function (r) {
      clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (md) {
      marked.setOptions({ gfm: true, breaks: false, headerIds: true, mangle: false });
      var html = marked.parse(md);
      var doc = document.getElementById('doc');
      doc.innerHTML = html;

      // mermaid fences -> .mermaid blocks
      mermaidSources = [];
      doc.querySelectorAll('pre code.language-mermaid').forEach(function (code) {
        var div = document.createElement('div');
        div.className = 'mermaid';
        mermaidSources.push(code.textContent);
        code.parentNode.replaceWith(div);
      });

      // scrollable tables + heading anchors
      doc.querySelectorAll('table').forEach(function (t) {
        var w = document.createElement('div');
        w.className = 'tablewrap';
        t.parentNode.insertBefore(w, t);
        w.appendChild(t);
      });
      var seen = {};
      doc.querySelectorAll('h2, h3').forEach(function (h) {
        var base = (h.textContent || '').toLowerCase()
          .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'section';
        seen[base] = (seen[base] || 0) + 1;
        h.id = seen[base] > 1 ? base + '-' + seen[base] : base;
      });

      // make the AI-review markers legible
      doc.querySelectorAll('em').forEach(function (em) {
        if (/AI GENERATED/i.test(em.textContent)) {
          var s = document.createElement('span');
          s.className = 'aiflag';
          s.textContent = 'AI — REVIEW';
          em.replaceWith(s);
        }
      });
      doc.innerHTML = doc.innerHTML.split('⚠️ <span class="aiflag"')
        .join('<span class="aiflag"');

      tagChanges(doc);
      buildToc(doc);
      drawMermaid();
    })
    .catch(function (err) {
      clearTimeout(timer);
      if (!window.marked) {
        fail('The markdown renderer did not load',
          'This page pulls <code>marked</code> and <code>mermaid</code> from cdnjs. One of them was ' +
          'blocked or unreachable, so the PRD cannot be drawn.');
        return;
      }
      fail('Could not load the PRD',
        'Fetching <code>' + MD + '</code> failed — ' +
        (err && err.name === 'AbortError' ? 'the request timed out' : (err && err.message)) + '.');
    });

  // ── What changed since v1.0 ──────────────────────────────────
  // Keyed on a row's FIRST CELL: an exact id, or a prefix for rows that have no id.
  // Update this when the markdown changes; nothing else here needs touching.
  var TAGS = [
    // v1.1 — coupons and the VIP offering
    ['R2',                              'new',    'v1.1'],
    ['G6',                              'new',    'v1.1'],
    ['MQ-9',                            'new',    'v1.1'],
    ['AC-COUPON-1',                     'new',    'v1.1'],
    ['AC-COUPON-2',                     'new',    'v1.1'],
    ['AC-COUPON-3',                     'new',    'v1.1'],
    ['AC-COUPON-4',                     'new',    'v1.1'],
    ['AC-REG-4',                        'new',    'v1.1'],
    ['AC-GRD-3',                        'new',    'v1.1'],
    ['AC-COUPON-5',                     'new',    'v1.5'],
    ['AC-COUPON-6',                     'new',    'v1.5'],
    ['AC-COUPON-7',                     'new',    'v1.5'],
    ['AC-REG-5',                        'new',    'v1.5'],
    ['Field — coupon list',             'new',    'v1.5'],
    ['Action — claim a coupon',         'new',    'v1.5'],
    ['Popup — coupon applies at recharge','new',  'v1.5'],
    ['Popup button — see recharge plans','new',   'v1.5'],
    ['Let the coupon page know',        'new',    'v1.5'],
    ['Coupon',                          'new',    'v1.1'],
    ['VIP Offer',                       'new',    'v1.1'],
    ['Field — coupon on a covered row', 'new',    'v1.1'],
    ['Field — coupon-not-applicable',   'new',    'v1.1'],
    ['Field — coupon on an uncovered',  'new',    'v1.1'],
    ['Decide coupon eligibility',       'new',    'v1.1'],
    ['Hold the VIP offering back',      'new',    'v1.1'],
    ['G5',                              'edited', 'v1.1'],
    ['AC-REG-3',                        'edited', 'v1.1'],
    // v1.2 — the growth panel is in scope
    ['R8',                              'edited', 'v1.2'],
    ['T2',                              'edited', 'v1.7'],
    ['C-05',                            'new',    'v2.0'],
    ['AC-CFG-2',                        'new',    'v2.0'],
    ['AC-CFG-3',                        'new',    'v2.0'],
    ['Popup — coupon applies at recharge','edited','v2.0'],
    ['Popup button — see recharge plans','edited','v2.0'],
    ['Message — offer no longer available','edited','v2.0'],
    ['One switch that stops the whole feature','new','v2.0'],
    ['R5',                              'edited', 'v2.0'],
    ['R7',                              'edited', 'v1.7'],
    // v1.3 — G6 narrowed
    ['G6',                              'edited', 'v1.3'],
    ['R2',                              'edited', 'v1.3']
  ];

  var PROSE = [
    ['v1.1', 'Boundary now states that this offer supersedes the VIP offering for anyone in a win-back set, and that coupons are untouched on every plan the offer does not cover.'],
    ['v1.1', 'G5 “renewal is untouched” had to be amended — blocking a coupon <em>is</em> a change to what a recharge does, so it now names the one exception instead of contradicting R2.'],
    ['v1.2', 'The phasing table became a one-line Scope statement: the growth admin panel (R8) is in scope, and nothing is deferred.'],
    ['v1.3', 'G6 dropped “never neither” — that would have been broken by any ordinary recharge with no offer and no coupon.'],
    ['v1.4', '§4 now points at the <strong>CA Final Dev → Jan 2026 Onwards</strong> file; it was still citing the old CA July Sprint node. The per-screen frame links are still to be pinned.'],
    ['v1.5', 'The <strong>coupon page</strong> flow is now in the spec — a customer in a set who claims a coupon gets a notice and a route to the recharge screen instead of a discount, and the plan list renders at normal prices. New §4 block, R2f/R2g, four acceptance criteria.'],
    ['v1.6', 'R2g confirmed and spelled out: nothing is pre-discounted on arrival, but a coupon still applies at checkout on a plan the offer does not cover. One open question closed.'],
    ['v1.7', 'Review pass: three places still promised a recharge changes nothing — R7b, T2 in the canon table, and the plan-price row — while R2a plainly changes one thing. All three now name the coupon exception.'],
    ['v1.8', 'The §3a flow chart was still drawing the old world: two triggers, no coupons. It now has three triggers, the coupon fork on both recharge branches, and the coupon page routing into the recharge flow.'],
    ['v2.0', 'An on/off switch for the whole feature (C-05) — and, critically, switching off lifts the coupon block too, so nobody is left with neither days nor discount. Plus: “notice” was my word for it; the coupon page shows a <strong>popup</strong>.']
  ];

  function tagChanges(doc) {
    var byKey = {};
    TAGS.forEach(function (t) { (byKey[t[0]] = byKey[t[0]] || []).push({ kind: t[1], ver: t[2] }); });
    var keys = Object.keys(byKey).sort(function (a, b) { return b.length - a.length; });
    var hits = 0;

    doc.querySelectorAll('tbody tr').forEach(function (tr) {
      var cell = tr.querySelector('td');
      if (!cell) return;
      var head = (cell.textContent || '').trim();
      var key = keys.find(function (k) { return head === k || head.indexOf(k) === 0; });
      if (!key) return;
      tr.classList.add('is-chg');
      hits++;
      byKey[key].forEach(function (t) {
        var pill = document.createElement('span');
        pill.className = 'chg ' + t.kind;
        pill.textContent = (t.kind === 'new' ? 'new ' : 'edited ') + t.ver;
        cell.appendChild(pill);
      });
    });

    // Summary, placed under the document title.
    var box = document.createElement('div');
    box.className = 'whatsnew';
    box.innerHTML =
      '<h3>What changed since v1.0 — ' + hits + ' rows tagged</h3><ul>' +
      PROSE.map(function (p) { return '<li><span class="v">' + p[0] + '</span> — ' + p[1] + '</li>'; }).join('') +
      '</ul>';
    var h1 = doc.querySelector('h1');
    if (h1 && h1.nextSibling) h1.parentNode.insertBefore(box, h1.nextSibling);
    else doc.insertBefore(box, doc.firstChild);

    var btn = document.getElementById('spotBtn');
    btn.addEventListener('click', function () {
      var on = document.body.classList.toggle('spotlight');
      btn.classList.toggle('on', on);
      btn.textContent = on ? 'show everything' : 'spotlight changes';
    });
  }

  // ── Contents ─────────────────────────────────────────────────
  function buildToc(doc) {
    var toc = document.getElementById('toc');
    // The "what changed" box carries its own h3; it is furniture, not a section.
    var heads = [].slice.call(doc.querySelectorAll('h2, h3'))
      .filter(function (h) { return !h.closest('.whatsnew'); });
    if (!heads.length) return;
    heads.forEach(function (h) {
      var a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent.replace(/^\d+\.\s*/, '');
      if (h.tagName === 'H3') a.className = 'h3';
      toc.appendChild(a);
    });
    var links = toc.querySelectorAll('a');
    if (!('IntersectionObserver' in window)) return;
    var obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        links.forEach(function (l) {
          l.classList.toggle('active', l.getAttribute('href') === '#' + e.target.id);
        });
      });
    }, { rootMargin: '0px 0px -75% 0px' });
    heads.forEach(function (h) { obs.observe(h); });
  }
})();
</script>
</body>
</html>
